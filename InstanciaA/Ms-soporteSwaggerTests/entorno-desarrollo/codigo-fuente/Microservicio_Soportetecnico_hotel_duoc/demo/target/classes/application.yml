server:
  port: 8083
  error:
    include-binding-errors: always
    include-message: always

spring:
  application:
    name: MS-SOPORTE
  datasource:
    url: jdbc:mysql://mysql_servidor:3306/universidad_backend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: desarrollador
    password: password_seguro_123
